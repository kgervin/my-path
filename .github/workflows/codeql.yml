name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning on private repositories needs GitHub Code Security. Runs automatically when
    # the repo is public, or set the repository variable CODE_SCANNING_ENABLED=true.
    if: ${{ vars.CODE_SCANNING_ENABLED == 'true' || github.event.repository.private == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
