# Build once, promote the same artifact.
#
#   push to main  -> build, scan, sign images (once) -> deploy the API digest to STAGING
#                    -> wait until staging reports this commit -> smoke test incl. writes
#   push vX.Y.Z   -> (tag must be on main) -> approval (environment: production)
#                    -> verify the signature of the digest built from that commit
#                    -> deploy the SAME digest to PRODUCTION -> move `release` (web) to the tag
#                    -> wait until production reports this commit -> read-only smoke test
#
# Rollback: re-run the "Deploy to production" job of the previous tag's Release run; it
# redeploys that tag's digest. Deploys are off until RENDER_DEPLOY_ENABLED=true (see
# docs/deploy/render.md for the one-time setup).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/my-path-api
  STAGING_API: https://my-path-api-staging.onrender.com
  STAGING_WEB: https://my-path-web-staging.onrender.com
  PRODUCTION_API: https://my-path-api.onrender.com
  PRODUCTION_WEB: https://my-path-web.onrender.com

jobs:
  # ---------- build once (main only; tags reuse these images) ----------
  api:
    if: github.ref_type == 'branch'
    uses: ./.github/workflows/_image.yml
    permissions: { contents: read, packages: write, id-token: write }
    with: { component: api, context: backend }

  web:
    if: github.ref_type == 'branch'
    uses: ./.github/workflows/_image.yml
    permissions: { contents: read, packages: write, id-token: write }
    with: { component: web, context: frontend }

  # ---------- staging: every green commit on main ----------
  deploy-staging:
    name: Deploy to staging
    needs: [api, web]
    if: github.ref_type == 'branch' && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ env.STAGING_WEB }}
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy API digest to staging
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          DIGEST: ${{ needs.api.outputs.digest }}
        run: |
          test -n "$HOOK" || { echo "::error::RENDER_DEPLOY_HOOK_API is not set on the staging environment"; exit 1; }
          curl -fsS -X POST "$HOOK&imgURL=$(jq -rn --arg u "$API_IMAGE@$DIGEST" '$u|@uri')" -o /dev/null
          echo "Deploying $API_IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test staging (waits for this commit, then writes)
        run: python3 scripts/smoke_test.py --api "$STAGING_API" --web "$STAGING_WEB" --expect-release "$GITHUB_SHA" --write

  # ---------- production: tagged release, approved, same digest ----------
  deploy-production:
    name: Deploy to production
    if: github.ref_type == 'tag' && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production # required reviewer + v* tag policy
      url: ${{ env.PRODUCTION_WEB }}
    concurrency: { group: deploy-production, cancel-in-progress: false }
    permissions:
      contents: write # move the `release` branch for the production web build
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main; only commits that passed staging can be released"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the digest built on main for this commit
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "$API_IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          test -n "$digest" && test "$digest" != null || { echo "::error::No image for $GITHUB_SHA; did Release on main succeed?"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify it was signed by this repo's build on main
        run: |
          cosign verify "$API_IMAGE@${{ steps.digest.outputs.digest }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/_image\.yml@refs/heads/main$" \
            > /dev/null
      - name: Deploy the same API digest to production
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          test -n "$HOOK" || { echo "::error::RENDER_DEPLOY_HOOK_API is not set on the production environment"; exit 1; }
          curl -fsS -X POST "$HOOK&imgURL=$(jq -rn --arg u "$API_IMAGE@$DIGEST" '$u|@uri')" -o /dev/null
          echo "Deploying $API_IMAGE@$DIGEST ($GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"
      - name: Point the production web build at this release
        run: git push --force origin "$GITHUB_SHA:refs/heads/release"
      - name: Smoke test production (waits for this commit, read-only)
        run: python3 scripts/smoke_test.py --api "$PRODUCTION_API" --web "$PRODUCTION_WEB" --expect-release "$GITHUB_SHA"
