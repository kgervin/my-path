version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor: { update-types: [minor, patch] }
    ignore:
      # Types track the Node runtime (24 LTS); bump together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # Actions are pinned to commit SHAs (`uses: owner/action@<sha> # vX.Y.Z`); Dependabot
    # updates the SHA and the comment together. Minor/patch bumps arrive as one PR.
    groups:
      # init/analyze (and upload-sarif) must always be the same CodeQL version.
      codeql:
        patterns: ["github/codeql-action*"]
      actions-minor: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
    ignore:
      # Runtime upgrades change the image, CI, Render and .python-version together, and Node
      # moves only between LTS (even) releases. Patch/digest updates still flow automatically.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
