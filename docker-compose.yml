# Local production-like stack.  `docker compose up --build` then open http://localhost:8080
# Add `--profile observability` for Prometheus (9090) and Grafana (3000).
name: my-path

services:
  api:
    build: ./backend
    environment:
      MY_PATH_ENVIRONMENT: local
      MY_PATH_LOG_LEVEL: INFO
      MY_PATH_DRAFTER: ${MY_PATH_DRAFTER:-template}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - api-data:/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  web:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: [observability]
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  api-data:
