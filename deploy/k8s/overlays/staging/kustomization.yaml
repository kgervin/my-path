apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: my-path-staging
resources:
  - ../../base
patches:
  - target: { kind: Ingress, name: my-path }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: my-path-staging.example.edu
      - op: replace
        path: /spec/tls/0/hosts/0
        value: my-path-staging.example.edu
  - target: { kind: ConfigMap, name: my-path-api }
    patch: |-
      - op: replace
        path: /data/MY_PATH_ENVIRONMENT
        value: staging
