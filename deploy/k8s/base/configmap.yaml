apiVersion: v1
kind: ConfigMap
metadata:
  name: my-path-api
data:
  MY_PATH_ENVIRONMENT: production
  MY_PATH_LOG_LEVEL: INFO
  MY_PATH_DRAFTER: template
  MY_PATH_LLM_MAX_CONCURRENCY: "8"
  MY_PATH_OTEL_ENABLED: "false"
# Secrets (not committed): create `my-path-api` Secret with MY_PATH_DATABASE_URL
# (postgresql+asyncpg://...) and, when MY_PATH_DRAFTER=anthropic, ANTHROPIC_API_KEY.
# Prefer External Secrets / Sealed Secrets over kubectl-created secrets.
