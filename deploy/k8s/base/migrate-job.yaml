# Runs `alembic upgrade head` before new pods take traffic (Argo CD / Flux sync-wave, or
# `kubectl apply` then `kubectl wait --for=condition=complete job/my-path-migrate`).
apiVersion: batch/v1
kind: Job
metadata:
  name: my-path-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: my-path
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: my-path-api
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: my-path-api }
            - secretRef: { name: my-path-api }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
